<!DOCTYPE html>

	<head>
		<title>Bread Petting</title>
	</head>

	<body>
        <h2 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;text-align: center;">Mood: Happy</h2>
        <img id="pet-image" src="idel.jpg" width="500" height="500">
        <p style="text-align: center;background-origin: padding-box;font-size: 17px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-weight: bold;text-decoration: underline;">Toasty</p>
        <br>
        <div style="display: flex;justify-content: center;gap: 8px;">
            <button id="feed-btn" type="button" style="margin: 0;font-size: 25px;height: 65px;width: 80px;">Feed</button>
            <button id="say-btn" type="button" style="margin: 0;font-size: 25px;height: 65px;width: 80px;">say</button>
            <button id="sleep-btn" type="button" style="margin: 0;font-size: 25px;height: 65px;width: 80px;">Sleep</button>
            <button id="drink-btn" type="button" style="margin: 0;font-size: 25px;height: 65px;width: 80px;">Drink</button>
            <button id="wash-btn" type="button" style="margin: 0;font-size: 25px;height: 65px;width: 80px;">Wash</button>
        </div>
        <script>
        const petImage = document.getElementById('pet-image');
        let resetTimer = null;
        function showImage(img) {
            clearTimeout(resetTimer);
            petImage.src = img;
            resetTimer = setTimeout(() => {
                petImage.src = 'idel.jpg';
            }, 2000);
        }
        document.getElementById('feed-btn').onclick = () => showImage('eating.jpg');
        document.getElementById('say-btn').onclick = () => showImage('saying.jpg');
        document.getElementById('sleep-btn').onclick = () => showImage('sleeping.jpg');
        document.getElementById('drink-btn').onclick = () => showImage('drinking.jpg');
        document.getElementById('wash-btn').onclick = () => showImage('washing.jpg');
        </script>
    </body>

</html>
